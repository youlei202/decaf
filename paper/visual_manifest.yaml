schema_version: 1
assets:
  figure_01:
    kind: figure
    number: 1
    title: Conceptual overview
    run_ids: []
    raw_inputs: []
    generator: decaf.paper.render.render_source_missing_asset
    tex_target: paper/generated/figures/figure_01.tex
    status: source_missing
    source_note: The original paper-only TikZ coordinates were not present in the sealed sources.
    generation_contract:
      status: source_missing
      operation: Recover the original conceptual layout and coordinates.
    headline_assertions: []
  figure_02:
    kind: figure
    number: 2
    title: Matched magnitude and false-null ordering
    run_ids: [C0]
    raw_inputs:
      - {run_id: C0, member: benchmark/response_contamination.csv}
      - {run_id: C0, member: benchmark/method_metrics.csv}
      - {run_id: C0, member: benchmark/null_false_evidence.csv}
    generator: decaf.paper.render.render_data_asset
    tex_target: paper/generated/figures/figure_02.tex
    status: ready
    generation_contract:
      status: replay_derived
      operation: Compare false-evidence ordering after magnitude matching.
    headline_assertions:
      - id: figure_02_intended_abs_magnitude
        status: verified
        input: {run_id: C0, member: benchmark/response_contamination.csv}
        operation: filtered_mean
        filters: {task: object_shape, factor: object_shape}
        column: mean_auc_abs
        expected: 0.05079873173186311
        expected_rows: 6
        tolerance: 0.00000000000001
      - id: figure_02_endpoint_null_abs_magnitude
        status: verified
        input: {run_id: C0, member: benchmark/response_contamination.csv}
        operation: filtered_mean
        filters: {task: object_shape, factor: floor_color}
        column: mean_auc_abs
        expected: 0.05268779850012135
        expected_rows: 6
        tolerance: 0.00000000000001
      - id: figure_02_abs_cmmr_false_null_order
        status: verified
        input: {run_id: C0, member: benchmark/method_metrics.csv}
        operation: filtered_mean
        filters: {method: Abs-CMMR}
        column: false_null_order
        expected: 0.0732142857142857
        expected_rows: 1
        tolerance: 0.00000000000001
      - id: figure_02_align_cmmr_false_null_order
        status: verified
        input: {run_id: C0, member: benchmark/method_metrics.csv}
        operation: filtered_mean
        filters: {method: Align-CMMR}
        column: false_null_order
        expected: 0.0
        expected_rows: 1
        tolerance: 0.0
  figure_03:
    kind: figure
    number: 3
    title: Evidence and learned reliance
    run_ids: [C1]
    raw_inputs:
      - {run_id: C1, member: results/endpoint_behavior_v1_measurement/aggregate_summary.parquet}
      - {run_id: C1, member: results/endpoint_behavior_v1_measurement/stage_summary.parquet}
      - {run_id: C1, member: results/endpoint_behavior_v1_measurement/tables/T03_module_e_correlations.csv}
