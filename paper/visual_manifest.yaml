    tex_target: paper/generated/figures/figure_03.tex
    status: ready
    generation_contract:
      status: replay_derived
      operation: Recompute Module-E correlations and the deterministic representative trajectory.
    headline_assertions:
      - id: figure_03_evidence_correspondence
        status: verified
        input: {run_id: C1, member: results/endpoint_behavior_v1_measurement/tables/T03_module_e_correlations.csv}
        operation: filtered_mean
