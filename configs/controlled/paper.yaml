experiment: controlled
profile: paper
schema_version: 1
max_workers: 32

assets:
  dataset_root: '${DECAF_DATA_ROOT}/3d_shapes'
  c0_model_manifest: model_manifest.csv
  c1_model_manifest: endpoint_behavior_model_manifest.csv
  c2_model_manifest: context_swap_model_manifest.csv
  c0_no_retraining: true

execution:
  backend: materialized_accelerator_outputs
  materialized_root_environment: DECAF_CONTROLLED_GPU_OUTPUT_ROOT
  member_manifest: manifests/members.json
  analysis_manifest: manifests/analysis.json
  analysis_root: analysis

base:
  tasks: [object_color, object_shape, wall_color, color_shape_xor, context_gate]
  architectures: [resnet18, small_vit]
  seeds: [3101, 3102, 3103]
  factors: [floor_color, wall_color, object_color, object_size, object_shape, object_orientation]
  dynamic_samples: 4096
  endpoint_samples: 8192
  endpoint_epsilon: 0.0001
  alpha_grid: [0.00, 0.0666666667, 0.1333333333, 0.20, 0.2666666667, 0.3333333333, 0.40, 0.4666666667, 0.5333333333, 0.60, 0.6666666667, 0.7333333333, 0.80, 0.8666666667, 0.9333333333, 1.00]
  linear_lambda_grid: [0.00, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]
  geometries: [cmmr, diagonal, power]
  power_betas: [0.25, 0.50, 0.75]

endpoint_behavior:
  architectures: [resnet18, small_vit]
  causal_variants: [aligned, neutral, reversed]
  causal_seeds: [5201, 5202, 5203]
  fragility_variants: [fragile, neutral, robust]
  fragility_seeds: [5301, 5302, 5303]
  terminal_epoch: 20
  expected_training_jobs: 44
  expected_counts: {E: 52, C: 18, F: 18}
  evidence_selection:
    resnet18:
      '0.95':
        '5101': [1, 5, 9, 13, 18, 22, 26, 30]
        '5102': [1, 5, 9, 13, 18, 22, 26, 30]
      '0.99':
        '5101': [1, 2, 27, 30]
        '5102': [1, 6, 23, 30]
    small_vit:
      '0.95':
        '5101': [1, 4, 7, 8, 15, 30]
        '5102': [1, 6, 7, 8, 19, 30]
      '0.99':
        '5101': [1, 5, 9, 13, 18, 22, 26, 30]
        '5102': [1, 5, 9, 13, 18, 22, 26, 30]
  passes:
    pass1:
      samples_per_model_factor: 1024
      alpha_grid: [0.00, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 1.00]
      noise_seeds: [6101, 6102]
      counterfactual_maps: 2
      geometries: [cmmr]
    pass2:
      samples_per_model_factor: 4096
      endpoint_samples: 8192
      alpha_grid: [0.00, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]
      noise_seeds: [6201, 6202, 6203, 6204]
      counterfactual_maps: 2
      geometries: [cmmr, pixel, diagonal, power]
      power_betas: [0.25, 0.50, 0.75]
  endpoint_epsilon: 0.0001
  accumulation_dtype: float64
  shared_noise_within_counterfactual_pair: true
  bootstrap_repetitions: 500
  bootstrap_confidence_level: 0.90

contradiction:
  tasks: [direct, gate, invert]
  architectures: [resnet18, small_vit]
  seeds: [7101, 7102, 7103, 7104, 7105]
  expected_models: 30
  wall_maps: [1, 2]
  object_maps: [1, 2]
  epsilon_grid: [0.000, 0.025, 0.050, 0.075, 0.100, 0.125, 0.150, 0.175, 0.200, 0.225, 0.250, 0.275, 0.300, 0.325, 0.350, 0.375, 0.400, 0.425, 0.450, 0.475, 0.500]
  train_samples: 60000
  validation_samples: 10000
  test_pairs: 16384
  epochs: 25
  maximum_epochs: 35
  bootstrap_repetitions: 2000

expected_plan:
  base_models: 30
  base_model_factor_units: 180
  evidence_checkpoints: 52
  causal_checkpoints: 18
  fragility_checkpoints: 18
  endpoint_behavior_checkpoints: 88
  endpoint_behavior_training_jobs: 44
  endpoint_behavior_units_per_pass: 158
  endpoint_behavior_units_total: 316
  contradiction_models: 30
  contradiction_evaluation_units: 30
  scheduled_members: 600

