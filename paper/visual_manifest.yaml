      - id: figure_05_c_swap_correlation
        status: verified
        inputs:
          - {run_id: C2, member: evaluation/epsilon_curves.csv}
          - {run_id: C2, member: evaluation/behavior_rates.csv}
        operation: joined_spearman
        join_columns: [model_id, task, architecture, seed, wall_map, epsilon]
        columns: [C, pairwise_swap_rate]
        expected: 0.9606652000
        tolerance: 0.0000000001
      - id: figure_05_abs_swap_correlation
        status: verified
        inputs:
          - {run_id: C2, member: evaluation/epsilon_curves.csv}
          - {run_id: C2, member: evaluation/behavior_rates.csv}
        operation: joined_spearman
        join_columns: [model_id, task, architecture, seed, wall_map, epsilon]
        columns: [Abs, pairwise_swap_rate]
        expected: -0.0359076958
        tolerance: 0.0000000001
      - id: figure_05_invert_c_at_registered_mismatch
        status: verified
        input: {run_id: C2, member: tables/T06_seed_results.csv}
        operation: filtered_mean
        filters: {task: invert}
        column: C
        expected: 0.49999733161716053
        tolerance: 0.000000000001
