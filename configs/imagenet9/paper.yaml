schema_version: 1
experiment: imagenet9
profile: paper
max_workers: 32
data:
  root_environment: DECAF_DATA_ROOT
  dataset_subdirectory: imagenet9
  input_size: 224
  paired_variant_rows: 4050
  score_pairs_requested: 2048
  score_pairs: 1644
  deep_pairs: 768
  shard_size: 512
  sampling_seed: 91701
  score_shortfall_policy: preserve_disjoint_split_use_all_available
  required_variants: [original, mixed_same, mixed_rand, mixed_next, only_fg]
