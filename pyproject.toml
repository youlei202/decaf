[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "decaf-repro"
version = "0.1.0"
description = "Reproducible endpoint-anchored decomposition of counterfactual trajectories"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "DECAF contributors" }]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.12",
]

[project.scripts]
decaf-paper = "decaf.paper.render:main"
decaf-verify = "decaf.verification:main"

[tool.hatch.build.targets.wheel]
packages = ["src/decaf"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B018"]
