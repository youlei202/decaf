    [resnet50, convnext_tiny, efficientnet_b3, regnet_y_8gf, swin_t, vit_b_16]
  finetune_regimes: [original, mixed_rand, mixed_next, only_fg]
  finetune_seeds: [7101, 7102]
  deep_pretrained_indices: [0, 1, 5, 6, 8, 9, 10, 11, 13, 14, 17, 18, 20, 21, 22, 23]
  deep_finetuned_backbones: [resnet50, convnext_tiny, swin_t, vit_b_16]
  deep_selection_seed: 7101
  num_classes: 9
baselines:
  methods: [input_x_gradient, integrated_gradients, smoothgrad, blur_ig, occlusion, rise]
  integrated_gradients_steps: 16
  smoothgrad_samples: 16
  blur_ig_levels: 12
  occlusion_grid: 7
  rise_masks: 256
  difference_threshold: 0.031372549
  difference_dilation: 3
training:
  epochs: 8
  checkpoint_epochs: [1, 2, 4, 8]
  optimizer: AdamW
  scheduler: cosine
  warmup_epochs: 1
  precision: bf16
  random_resized_crop_scale: [0.7, 1.0]
  horizontal_flip: true
  families:
    cnn:
      backbones: [resnet50, efficientnet_b3, regnet_y_8gf]
      batch_size: 256
      lr: 0.0003
      weight_decay: 0.0001
    transformer_convnext:
      backbones: [convnext_tiny, swin_t, vit_b_16]
      batch_size: 128
      lr: 0.0001
      weight_decay: 0.05
corruptions:
  gaussian_blur_sigma: [2.0, 5.0]
  gaussian_noise_std: [0.05, 0.12]
  color_shift: [0.1, 0.2]
  pixelation_factor: [4, 8]
  patch_shuffle_grid: [4, 8]
statistics:
  bootstrap_repetitions: 500
  bootstrap_seed: 91702
  confidence_levels: [0.9, 0.95]
  matched_abs_bins: 20
  matched_abs_relative_tolerance: 0.05
reference_run: I9
checkpoints:
  root_environment: DECAF_CACHE_ROOT
paper_assets:
  figures: [6, 7, 12]
  tables: [1]
